services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build: ./services/auth-service
    env_file: .env
    ports:
      - "8001:8000"

  listings-service:
    build: ./services/listings-service
    env_file: .env
    ports:
      - "8002:8000"

  ai-service:
    build: ./services/ai-service
    env_file: .env
    ports:
      - "8003:8000"

  trust-service:
    build: ./services/trust-service
    env_file: .env
    ports:
      - "8004:8000"

  insights-service:
    build: ./services/insights-service
    env_file: .env
    ports:
      - "8005:8000"

  search-service:
    build: ./services/search-service
    env_file: .env
    ports:
      - "8006:8000"

  notifications-service:
    build: ./services/notifications-service
    env_file: .env
    ports:
      - "8007:8000"

  api-gateway:
    build: ./services/api-gateway
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      LISTINGS_SERVICE_URL: http://listings-service:8000
      AI_SERVICE_URL: http://ai-service:8000
      TRUST_SERVICE_URL: http://trust-service:8000
      INSIGHTS_SERVICE_URL: http://insights-service:8000
      SEARCH_SERVICE_URL: http://search-service:8000
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8000
    depends_on:
      - auth-service
      - listings-service
      - ai-service
      - trust-service
      - insights-service
      - search-service
      - notifications-service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"

volumes:
  pgdata:
